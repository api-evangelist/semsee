description: >-
  FinOps view of Semsee spend. Semsee is a sales-led SaaS quoting platform with
  no public, usage-metered pricing and no public developer API. Costs are
  governed by negotiated agency, partner-integration, and carrier/MGA
  agreements rather than per-call or per-token metering. Because no public
  pricing or metered API usage is documented, the cost meters below are
  illustrative placeholders and this artifact is NOT reconciled.
notes: >-
  No public pricing or billing exports are documented. Reconcile against a
  Semsee order form / partner agreement during reconciliation.
