  dimensions:
  - account
- name: partner_integration
  description: Negotiated partner Upload/Download (AMS) integration fee, if any. Not publicly priced.
  unit: contract
  aggregation: sum
  dimensions:
  - account
- name: carrier_connectivity
  description: Negotiated carrier/MGA connectivity terms. Not publicly priced or metered.
  unit: contract
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track Semsee subscription and partner-integration invoices; no public usage export or metered API exists.
- name: Allocation
  description: Map Semsee agency/partner/carrier agreements to the relevant business units.
- name: Optimization
  description: Right-size agency seats and partner-integration scope against actual quoting volume; negotiate at renewal.
- name: Accountability
  description: Assign an owner for the Semsee relationship and review contract spend at renewal.
