openapi: 3.0.1
info:
  title: Semsee API
  description: >-
    Semsee is a digital small-commercial insurance quoting platform that
    connects independent agents to 50+ carriers and MGAs via API and RPA
    integrations, handling submissions, multi-carrier quoting, proposals, and
    binding. As of this writing Semsee does NOT publish a public, self-serve
    developer API reference. The platform offers a partner-gated Upload/Download
    (AMS) integration capability and SSO that require a partner agreement and
    Semsee development resources; the request/response schemas, endpoint paths,
    authentication scheme, and production base URL are not publicly documented.

    No operations are defined in this specification because none are publicly
    documented. This file is an accurate placeholder rather than a fabricated
    interface. Semsee was acquired by iBynd in March 2026; future end-to-end
    submission-to-bind infrastructure may surface a documented API.
  termsOfService: https://semsee.com/terms-of-service
  contact:
    name: Semsee
    url: https://semsee.com/contact
  version: '0.0.0'
servers: []
paths: {}
components: {}
