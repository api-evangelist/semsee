actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No public API surface (REST, SSE, or WebSocket) is documented, so no
    AsyncAPI or OpenAPI operations were authored. apis.yml documents the
    provider honestly with partner-gated integration entries, and the OpenAPI
    file uses an empty paths object with an accurate description to avoid
    fabricating an interface. Ownership was corrected to iBynd (March 2026),
    distinct from Bold Penguin / American Family.
